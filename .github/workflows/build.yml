name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: latest
            packages: ""
            suffix: ""
          - tag: firefox
            packages: firefox-esr
            suffix: -firefox
          - tag: chromium
            packages: chromium
            suffix: -chromium

    steps:
      - uses: actions/checkout@v5

      # arm64 builds run through qemu
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest / :firefox / :chromium
      # tag v1.2.3 -> :1.2.3 / :1.2.3-firefox / :1.2.3-chromium (+ 1.2)
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/iercann/dropdesk
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          build-args: EXTRA_PACKAGES=${{ matrix.packages }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
